[package]
name = "toolbox"
description = "Toolbox desktop app: small everyday tools for developers and power users"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
toolbox-core.workspace = true
eframe.workspace = true
egui.workspace = true
rfd.workspace = true
image.workspace = true
jiff.workspace = true
egui_commonmark.workspace = true

# The screen eyedropper uses AppKit's NSColorSampler; color_space.rs tags the window as sRGB.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
raw-window-handle = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-core-foundation",
    "NSColor",
    "NSColorSampler",
    "NSColorSpace",
    "NSResponder",
    "NSView",
    "NSWindow",
] }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu"] }
