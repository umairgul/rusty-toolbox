[workspace]
resolver = "3"
members = ["crates/*", "xtask", "uniffi-bindgen"]
# Plain `cargo build`/`cargo test` skip xtask and uniffi-bindgen, which are only needed for
# `cargo xtask` and generating the Swift bindings.
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# internal
toolbox-core = { path = "crates/toolbox-core" }

# ffi
uniffi = "0.32"

# tools
rand = "0.10"
uuid = { version = "1", features = ["v4", "v7"] }
qrcode = { version = "0.14", default-features = false }
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "gif",
    "bmp",
    "ico",
    "tiff",
    "avif",
    "rayon",
] }
kamadak-exif = "0.6"
crc32fast = "1"
resvg = "0.48"
# preserve_order keeps object keys in input order (Data Formats, JWT payloads).
serde_json = { version = "1", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
blake3 = "1"
hmac = "0.13"
base64 = "0.23"
html-escape = "0.3"
jiff = "0.2"
croner = { version = "4", default-features = false, features = ["jiff"] }
serde-saphyr = "1"
toml = "1"
csv = "1"
fancy-regex = "0.19"
similar = { version = "3", features = ["inline"] }
sqlformat = "0.5"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[workspace.lints.rust]
# No crate needs `unsafe`. UniFFI's generated scaffolding comes from its own macros, which
# this lint doesn't apply to.
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# Build dependencies optimized even in debug, so the GUI stays smooth during development.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = true
